name: collect

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  models: read

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # cache/ holds third-party page text (never committed). Keeping it
      # between runs lets the 30-day skip work and gives enrich-llm.mjs the
      # reference text without re-crawling ~300 pages every 6 hours.
      - name: Restore page cache
        uses: actions/cache@v4
        with:
          path: cache
          key: page-cache-${{ github.run_id }}
          restore-keys: page-cache-

      - name: Run data collection
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BATCH: "30"
        run: node scripts/run-all.mjs

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit and push results
        run: |
          git add data state imports
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "data: collect run $(date -u +%Y-%m-%d)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
